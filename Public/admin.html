<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vegeta Admin</title>

<style>
body{font-family:Arial;background:#f5fff4;margin:0;color:#183018}
.wrap{max-width:1050px;margin:auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #0001}
input,select{padding:10px;margin:4px;border:1px solid #ccc;border-radius:8px}
.btn{padding:10px 14px;border:0;border-radius:8px;font-weight:700}
.green{background:#208a3b;color:#fff}
.danger{background:#ffe3e3;color:#900}
.hidden{display:none}
.row{display:grid;grid-template-columns:1fr 100px 120px 80px;gap:7px;align-items:center;border-bottom:1px solid #eee;padding:8px}
.order{border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}
</style>
</head>

<body>

<header style="background:#208a3b;color:#fff;padding:15px">
<div class="wrap" style="padding:0">
<b>🥬 Vegeta Owner Admin</b>
<button id="logout" class="btn" style="float:right" onclick="logout()">Logout</button>
</div>
</header>

<main class="wrap">

<section id="login" class="card">
<h2>🔐 Admin Login</h2>
<input id="pass" type="password" placeholder="Password">
<button class="btn green" onclick="login()">Login</button>
<p id="msg"></p>
</section>

<section id="dash" class="hidden">

<div class="card">
<h2>🥕 Products</h2>
<p style="color:#555">
Save করলে customer page-এ change automatically update হবে (সাধারণত 2 সেকেন্ডের মধ্যে)।
</p>

<div id="products"></div>

<h3>Add Vegetable</h3>
<input id="pn" placeholder="Name">
<input id="pe" placeholder="Emoji">
<input id="pp" type="number" placeholder="Price/kg">
<button class="btn green" onclick="addProduct()">Add</button>
</div>

<div class="card">
<h2>📦 Orders</h2>
<div id="orders"></div>
</div>

</section>
</main>

<script>

async function api(u,o={}){
let r=await fetch(u,o);
let d=await r.json();
if(!r.ok)throw Error(d.error||'Error');
return d;
}

async function login(){
try{
await api('/api/admin/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({password:pass.value})
});
show();
}catch(e){
msg.textContent=e.message;
}
}

async function show(){
loginEl.classList.add('hidden');
dash.classList.remove('hidden');
load();
}

let loginEl=document.getElementById('login');

async function load(){

let p=await api('/api/products');

products.innerHTML=p.map(x=>`
<div class="row" style="grid-template-columns:1.4fr 90px 110px 110px 80px;">

<input id="n${x.id}" value="${esc(x.name)}">

<input id="e${x.id}" value="${esc(x.emoji)}">

<input id="p${x.id}" type="number" value="${x.price}">

<select id="s${x.id}">
<option value="1" ${x.stock?'selected':''}>In stock</option>
<option value="0" ${!x.stock?'selected':''}>Out</option>
</select>

<button class="btn green" onclick="edit(${x.id})">
Save
</button>

<button class="btn danger" onclick="del(${x.id})">
Delete
</button>

</div>
`).join('');

let o=await api('/api/admin/orders');

orders.innerHTML=o.length?

o.map(x=>`
<div class="order">

<b>${x.order_code}</b> —
${x.customer} —
₹${x.total.toFixed(2)}

<br>

${x.phone}

<br>

${x.address}

<br>

${
x.location_lat!==null&&x.location_lng!==null
?
`📍 <a href="https://www.google.com/maps?q=${x.location_lat},${x.location_lng}" target="_blank">
Open delivery location on Map
</a>
<br>
<small>
${Number(x.location_lat).toFixed(6)},
${Number(x.location_lng).toFixed(6)}
</small>
<br>`
:
'📍 No map location selected'
}

<select onchange="status(${x.id},this.value)">

${
['New','Confirmed','Preparing','Out for delivery','Delivered','Cancelled']
.map(s=>`
<option ${x.status===s?'selected':''}>
${s}
</option>
`).join('')
}

</select>

</div>
`).join('')

:

'No orders yet.';
}

function esc(v){
return String(v)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;');
}

async function edit(id){

let name=document.getElementById('n'+id).value.trim();

let emoji=
document.getElementById('e'+id).value.trim()||'🥬';

let price=
Number(document.getElementById('p'+id).value);

let stock=
document.getElementById('s'+id).value==='1';

if(!name||!Number.isFinite(price)||price<0)
return alert('Enter valid product details.');

await api('/api/admin/products/'+id,{
method:'PATCH',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
name,
emoji,
price,
stock
})
});

load();
}

async function del(id){

if(confirm('Delete product?')){

await api('/api/admin/products/'+id,{
method:'DELETE'
});

load();

}
}

async function addProduct(){

await api('/api/admin/products',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
name:pn.value,
emoji:pe.value||'🥬',
price:Number(pp.value),
stock:true
})
});

pn.value=pe.value=pp.value='';

load();
}

async function status(id,s){

await api('/api/admin/orders/'+id,{
method:'PATCH',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({status:s})
});

load();
}

async function logout(){

await api('/api/admin/logout',{
method:'POST'
});

location.reload();

}

api('/api/admin/me')
.then(show)
.catch(()=>{});

</script>

</body>
</html>
